name: Build Data & Deploy GitHub Pages

# Deploys on every push to main and, on a schedule, rebuilds the site with a fresh
# K-water snapshot every hour (data/*.json are generated at build time, never committed).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '20 * * * *'   # every hour at :20 UTC — MyWater publishes hourly rows shortly after the hour (KST)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # 1. CI Validation Gate
  validate:
    name: Validate Scripts & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript Syntax
        run: npm run check

  # 2. Build data + Deploy (main branch only)
  deploy:
    name: Fetch K-water Data & Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live dam data from K-water MyWater
        run: npm run fetch

      - name: Summarize fetched data
        run: |
          node -e "
            const l = require('./data/live.json');
            const withData = l.dams.filter(d => d.current && d.current.storageRate !== null).length;
            console.log('observedAt', l.observedAt, '· dams with data', withData + '/' + l.dams.length);
            for (const d of l.dams) console.log(d.id.padEnd(11), String(d.current.storageRate).padStart(5) + '%', 'in', d.current.inflow, 'out', d.current.outflow);
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
