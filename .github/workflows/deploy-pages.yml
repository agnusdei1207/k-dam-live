name: Build Data & Deploy GitHub Pages

# Deploys on every push to main. On a schedule, a cheap freshness check runs every 10 minutes and
# the site is rebuilt only when MyWater has published a newer hour than the deployed snapshot
# (data/*.json are generated at build time, never committed). GitHub delays/drops sparse cron
# ticks heavily, so polling often is what keeps the site within roughly one observation hour.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false   # never abort a deployment that is already running

jobs:
  # 1. CI Validation Gate
  validate:
    name: Validate Scripts & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax and run tests
        run: npm test

  # 2. Scheduled runs: skip the full fetch when the site already shows the portal's latest hour
  freshness:
    name: Check for a newer MyWater observation
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      update: ${{ steps.check.outputs.update }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compare portal hour with deployed snapshot
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/needs-update.mjs
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

  # 3. Build data + Deploy (main branch only)
  deploy:
    name: Fetch K-water Data & Deploy to GitHub Pages
    needs: freshness
    if: needs.freshness.outputs.update == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live dam data from K-water MyWater
        run: npm run fetch

      - name: Validate fresh observations
        run: npm run check:data

      - name: Summarize fetched data
        run: |
          node -e "
            const l = require('./data/live.json');
            const withData = l.dams.filter(d => d.current && d.current.storageRate !== null).length;
            console.log('observedAt', l.observedAt, '· dams with data', withData + '/' + l.dams.length);
            for (const d of l.dams) console.log(d.id.padEnd(11), String(d.current.storageRate).padStart(5) + '%', 'in', d.current.inflow, 'out', d.current.outflow);
          "

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
